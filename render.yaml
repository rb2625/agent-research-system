services:
  - type: web
    name: agent-research-system-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: AGENT_MAX_ITERATIONS
        value: "8"
      - key: GROQ_RATE_LIMIT_PER_MINUTE
        value: "28"
      - key: GEMINI_RATE_LIMIT_PER_MINUTE
        value: "14"
